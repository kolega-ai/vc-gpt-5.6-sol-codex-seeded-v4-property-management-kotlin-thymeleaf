<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Inspections')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow">Property assurance</p><h1>Inspections</h1><p>Scheduled visits, findings and accountable follow-up work.</p></div></div><div class="detail-grid"><section><div class="card" th:each="i:${inspections}" style="margin-bottom:14px"><div class="page-head"><div><h2 th:text="'Inspection '+${#strings.substring(i.id.toString(),0,8)}"></h2><p th:text="${#temporals.format(i.scheduledFor,'dd MMM yyyy, HH:mm')}"></p></div><span class="status" th:classappend="'status-'+${i.status}" th:text="${#strings.replace(i.status,'_',' ')}"></span></div><p th:if="${!#strings.isEmpty(i.findings)}" th:text="${i.findings}"></p><p class="muted" th:if="${!#strings.isEmpty(i.followUp)}" th:text="'Follow-up: '+${i.followUp}"></p><div class="actions" th:if="${actor.role.name() == 'PROPERTY_ADMIN' || actor.role.name() == 'PROPERTY_MANAGER'}"><form th:each="s:${T(com.harbour.domain.InspectionStatus).values()}" th:if="${s != i.status}" th:action="@{/inspections/{id}/status(id=${i.id})}" method="post"><input type="hidden" name="status" th:value="${s}"><button class="btn btn-sm btn-secondary" th:text="${#strings.replace(s,'_',' ')}"></button></form></div></div><div class="card empty" th:if="${#lists.isEmpty(inspections)}">No inspections are available.</div></section><aside class="card" th:if="${actor.role.name() == 'PROPERTY_ADMIN' || actor.role.name() == 'PROPERTY_MANAGER'}"><h2>Schedule inspection</h2><form th:action="@{/inspections}" th:object="${form}" method="post"><div class="field"><label for="unitId">Unit</label><select id="unitId" th:field="*{unitId}" required><option value="">Choose unit</option><option th:each="u:${units}" th:value="${u.id}" th:text="${u.label}"></option></select></div><div class="field"><label for="scheduledFor">Date and time (UTC)</label><input id="scheduledFor" th:field="*{scheduledFor}" placeholder="2026-09-01T10:00:00Z" required></div><div class="field"><label for="findings">Initial notes</label><textarea id="findings" th:field="*{findings}"></textarea></div><label><input style="width:auto" th:field="*{tenantVisible}" type="checkbox"> Tenant can view report</label><button class="btn btn-primary" style="margin-top:12px">Schedule inspection</button></form></aside></div></div></main></div></body></html>
