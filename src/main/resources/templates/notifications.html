<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Updates')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div class="page-head"><div><p class="eyebrow">Activity inbox</p><h1>Updates</h1></div></div><section class="card"><div class="file-row" th:each="n:${notifications}"><div><a th:href="${n.link}" th:text="${n.message}"></a><div class="muted" th:text="${#temporals.format(n.createdAt,'dd MMM yyyy, HH:mm')}"></div></div></div><div class="empty" th:if="${#lists.isEmpty(notifications)}">You are all caught up.</div></section></div></main></div></body></html>
