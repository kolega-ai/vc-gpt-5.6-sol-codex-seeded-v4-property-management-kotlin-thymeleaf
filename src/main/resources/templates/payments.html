<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Payments')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div class="page-head"><div><p class="eyebrow">Financial records</p><h1>Payments</h1><p>Rent charges and recorded payment outcomes in their stored currency.</p></div><div class="actions"><a class="btn btn-secondary" href="/reports/payments.csv">Export payment history</a><a class="btn btn-secondary" th:if="${actor.role.name() == 'PROPERTY_ADMIN' || actor.role.name() == 'PROPERTY_MANAGER'}" href="/reports/rent-roll.csv">Export rent roll</a></div></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Due date</th><th>Paid date</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.reference}"></td><td th:text="${p.dueDate}"></td><td th:text="${p.paidDate ?: '—'}"></td><td th:text="${p.currency}+' '+${p.amount}"></td><td><span class="status" th:classappend="'status-'+${p.status}" th:text="${p.status}"></span></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(payments)}">No payment records are available.</div></div></div></main></div></body></html>
