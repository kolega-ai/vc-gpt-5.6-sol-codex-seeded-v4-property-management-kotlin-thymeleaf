<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Messages')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow">Resident communication</p><h1>Messages</h1><p>Direct, durable communication between residents and property teams.</p></div></div><div class="detail-grid"><section class="card"><h2>Conversation history</h2><div class="timeline"><article class="timeline-item" th:each="m:${messages}" th:classappend="${m.internal} ? ' internal'"><strong th:text="${m.subject}"></strong><p th:text="${m.body}"></p><small class="muted" th:text="${#temporals.format(m.createdAt,'dd MMM yyyy, HH:mm')}"></small></article></div><div class="empty" th:if="${#lists.isEmpty(messages)}">No messages yet. Start a conversation with the property team.</div></section><aside class="card"><h2>New message</h2><form th:action="@{/messages}" method="post"><div class="field"><label for="recipientId">To</label><select id="recipientId" name="recipientId" required><option value="">Choose recipient</option><option th:each="r:${recipients}" th:value="${r.id}" th:text="${r.displayName}+' · '+${#strings.replace(r.role,'_',' ')}"></option></select></div><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="140" required></div><div class="field"><label for="body">Message</label><textarea id="body" name="body" maxlength="3000" required></textarea></div><label th:if="${actor.role.name() != 'TENANT'}"><input style="width:auto" name="internal" type="checkbox" value="true"> Internal note</label><button class="btn btn-primary" style="margin-top:12px">Send message</button></form></aside></div></div></main></div></body></html>
