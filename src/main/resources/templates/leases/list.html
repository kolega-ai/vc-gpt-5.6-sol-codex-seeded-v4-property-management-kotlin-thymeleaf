<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Leases')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div class="page-head"><div><p class="eyebrow">Occupancy agreements</p><h1>Leases</h1><p>Dates, rent terms and controlled document access.</p></div></div><div class="table-wrap"><table><thead><tr><th>Lease</th><th>Start</th><th>End</th><th>Monthly rent</th><th>Status</th></tr></thead><tbody><tr th:each="l:${leases}"><td><a th:href="@{/leases/{id}(id=${l.id})}" th:text="${#strings.substring(l.id.toString(),0,8)}"></a></td><td th:text="${l.startDate}"></td><td th:text="${l.endDate}"></td><td th:text="${l.currency}+' '+${l.rentAmount}"></td><td><span class="status" th:classappend="'status-'+${l.status}" th:text="${#strings.replace(l.status,'_',' ')}"></span></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(leases)}">No leases are available in your scope.</div></div></div></main></div></body></html>
