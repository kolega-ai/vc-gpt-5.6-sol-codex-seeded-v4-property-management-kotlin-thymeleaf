<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Lease details')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow"><a href="/leases">Leases</a> / <span th:text="${unit.label}"></span></p><h1 th:text="${tenant.displayName}+' · Unit '+${unit.label}"></h1></div><span class="status" th:classappend="'status-'+${lease.status}" th:text="${#strings.replace(lease.status,'_',' ')}"></span></div><div class="grid grid-2"><section class="card"><h2>Agreement summary</h2><dl class="summary-list"><div><dt>Starts</dt><dd th:text="${lease.startDate}"></dd></div><div><dt>Ends</dt><dd th:text="${lease.endDate}"></dd></div><div><dt>Monthly rent</dt><dd th:text="${lease.currency}+' '+${lease.rentAmount}"></dd></div><div><dt>Deposit held</dt><dd th:text="${lease.currency}+' '+${lease.depositAmount}"></dd></div></dl><div class="actions" style="margin-top:18px" th:if="${actor.role.name() == 'PROPERTY_ADMIN'}"><form th:each="s:${T(com.harbour.domain.LeaseStatus).values()}" th:if="${s != lease.status}" th:action="@{/leases/{id}/status(id=${lease.id})}" method="post"><input type="hidden" name="status" th:value="${s}"><button class="btn btn-sm btn-secondary" th:text="${#strings.replace(s,'_',' ')}"></button></form></div></section><div class="actions" style="margin-top:18px" th:if="${actor.role.name() == 'PROPERTY_ADMIN'}"><form th:action="@{/leases/{id}/deposit-registration(id=${lease.id})}" method="post"><button class="btn btn-secondary">Register deposit with scheme</button></form></div><section class="card"><h2>Lease documents</h2><div class="file-row" th:each="d:${documents}"><div><strong th:text="${d.originalName}"></strong><div class="muted" th:text="'Version '+${d.versionNo}+' · '+${d.category}"></div></div><a class="btn btn-sm btn-secondary" th:href="@{/documents/{id}/download(id=${d.id})}">Download</a></div><div class="empty" th:if="${#lists.isEmpty(documents)}">No documents have been shared yet.</div></section><section class="card span-2"><h2>Payment history</h2><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Due</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="p:${payments}"><td th:text="${p.reference}"></td><td th:text="${p.dueDate}"></td><td th:text="${p.currency}+' '+${p.amount}"></td><td><span class="status" th:classappend="'status-'+${p.status}" th:text="${p.status}"></span></td></tr></tbody></table></div></section></div></div></main></div></body></html>
