<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Portfolio administration')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow">Portfolio administration</p><h1>Properties, units & leases</h1><p>Core portfolio records and occupancy agreements.</p></div></div><div class="grid grid-3"><section class="card"><h2>New property</h2><form th:action="@{/admin/properties}" th:object="${propertyForm}" method="post"><div class="field"><label>Name</label><input th:field="*{name}" required></div><div class="field"><label>Address</label><input th:field="*{address}" required></div><div class="field"><label>Building code</label><input th:field="*{buildingCode}" required></div><div class="field"><label>City</label><input th:field="*{city}" required></div><div class="field"><label>Manager</label><select th:field="*{managerId}"><option value="">Unassigned</option><option th:each="m:${managers}" th:value="${m.id}" th:text="${m.displayName}"></option></select></div><button class="btn btn-primary" style="margin-top:10px">Create property</button></form></section><section class="card"><h2>New unit</h2><form th:action="@{/admin/units}" th:object="${unitForm}" method="post"><div class="field"><label>Property</label><select th:field="*{propertyId}" required><option value="">Choose property</option><option th:each="p:${properties}" th:value="${p.id}" th:text="${p.name}"></option></select></div><div class="field"><label>Unit label</label><input th:field="*{label}" required></div><div class="field"><label>Bedrooms</label><input th:field="*{bedrooms}" type="number" min="0" max="10"></div><div class="field"><label>Market rent (GBP)</label><input th:field="*{marketRent}" type="number" min="0" step="0.01"></div><button class="btn btn-primary" style="margin-top:10px">Create unit</button></form></section><section class="card"><h2>New draft lease</h2><form th:action="@{/leases}" th:object="${leaseForm}" method="post"><div class="field"><label>Tenant</label><select th:field="*{tenantId}" required><option value="">Choose tenant</option><option th:each="t:${tenantUsers}" th:value="${t.id}" th:text="${t.displayName}"></option></select></div><div class="field"><label>Unit</label><select th:field="*{unitId}" required><option value="">Choose unit</option><option th:each="u:${units}" th:value="${u.id}" th:text="${u.label}"></option></select></div><div class="field"><label>Start</label><input th:field="*{startDate}" type="date"></div><div class="field"><label>End</label><input th:field="*{endDate}" type="date"></div><div class="field"><label>Rent</label><input th:field="*{rentAmount}" type="number" step="0.01" min="0"></div><div class="field"><label>Deposit</label><input th:field="*{depositAmount}" type="number" step="0.01" min="0"></div><button class="btn btn-primary" style="margin-top:10px">Create draft</button></form></section></div><section class="card" style="margin-top:18px"><h2>Portfolio register</h2><div class="table-wrap"><table><thead><tr><th>Property</th><th>Building code</th><th>Address</th><th>Units</th><th>Cover</th></tr></thead><tbody><tr th:each="p:${properties}"><td th:text="${p.name}"></td><td th:text="${p.buildingCode}"></td><td th:text="${p.address}+', '+${p.city}"></td><td th:text="${#lists.size(units.?[propertyId == #root.p?.id])}">—</td><td><form th:action="@{/properties/{id}/cover(id=${p.id})}" method="post"><select onchange="document.cookie='coverManagerId='+this.value+';path=/'"><option value="">Choose</option><option th:each="m:${managers}" th:value="${m.id}" th:text="${m.displayName}"></option></select><button class="btn btn-sm btn-secondary">Assign</button></form></td></tr></tbody></table></div></section></div></main></div></body></html>
