<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Audit trail')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div class="page-head"><div><p class="eyebrow">Append-only record</p><h1>Audit trail</h1><p>Privileged actions, sensitive reads and workflow transitions.</p></div></div><form class="filterbar"><div class="field"><label for="action">Filter by action</label><input id="action" name="action" th:value="${action}" placeholder="e.g. DOCUMENT_DOWNLOADED"></div><button class="btn btn-secondary">Filter</button></form><div class="table-wrap"><table><thead><tr><th>When</th><th>Action</th><th>Resource</th><th>Actor</th><th>Authorization basis</th></tr></thead><tbody><tr th:each="e:${events}"><td th:text="${#temporals.format(e.createdAt,'dd MMM yyyy, HH:mm')}"></td><td><strong th:text="${e.action}"></strong></td><td th:text="${e.resourceType}+' · '+${e.resourceId}"></td><td th:text="${e.actorId ?: 'system'}"></td><td th:text="${e.authorizationBasis}"></td></tr></tbody></table></div></div></main></div></body></html>
