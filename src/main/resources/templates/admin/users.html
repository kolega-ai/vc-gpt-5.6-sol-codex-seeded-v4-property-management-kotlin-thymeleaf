<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('People & access')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow">Administration</p><h1>People & access</h1><p>Invite users, change roles and suspend access without impersonation.</p></div></div><div class="detail-grid"><section class="table-wrap"><table><thead><tr><th>Person</th><th>Role</th><th>Scope</th><th>Account</th><th>Actions</th></tr></thead><tbody><tr th:each="u:${users}"><td><strong th:text="${u.displayName}"></strong><div class="muted" th:text="${u.email}"></div></td><td><form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="actions"><select name="role"><option th:each="r:${T(com.harbour.domain.Role).values()}" th:value="${r}" th:text="${#strings.replace(r,'_',' ')}" th:selected="${r==u.role}"></option></select><button class="btn btn-sm btn-secondary">Save</button></form></td><td th:text="${u.buildingScope ?: 'All / own records'}"></td><td><span class="status" th:classappend="${u.enabled} ? 'status-ACTIVE' : 'status-CLOSED'" th:text="${u.enabled ? 'Enabled':'Disabled'}"></span></td><td><form th:action="@{/admin/users/{id}/enabled(id=${u.id})}" method="post"><input type="hidden" name="enabled" th:value="${!u.enabled}"><button class="btn btn-sm btn-secondary" th:text="${u.enabled ? 'Disable':'Enable'}"></button></form></td></tr></tbody></table></section><aside class="card"><h2>Invite user</h2><form th:action="@{/admin/users}" th:object="${form}" method="post"><div class="field"><label for="displayName">Name</label><input id="displayName" th:field="*{displayName}" required><span class="error-text" th:errors="*{displayName}"></span></div><div class="field"><label for="email">Email</label><input id="email" th:field="*{email}" type="email" required><span class="error-text" th:errors="*{email}"></span></div><div class="field"><label for="role">Role</label><select id="role" th:field="*{role}"><option th:each="r:${T(com.harbour.domain.Role).values()}" th:value="${r}" th:text="${#strings.replace(r,'_',' ')}"></option></select></div><div class="field"><label for="buildingScope">Building scope</label><input id="buildingScope" th:field="*{buildingScope}" placeholder="Optional building code"></div><button class="btn btn-primary" style="margin-top:12px">Create invite</button></form><form th:action="@{/directory/members}" method="get" style="margin-top:14px"><div class="field"><label for="dirName">Directory name</label><input id="dirName" name="name" required></div><button class="btn btn-secondary" style="margin-top:10px">Search directory</button></form></aside></div></div></main></div></body></html>
