<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Maintenance')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow">Workflow queue</p><h1>Maintenance</h1><p>Track every request from first report through verified completion.</p></div><a class="btn btn-primary" th:if="${actor.role.name() == 'TENANT'}" href="/tickets/new">New request</a></div><form class="filterbar" method="get"><div class="field"><label for="q">Search</label><input id="q" name="q" th:value="${q}" placeholder="Title or category"></div><div class="field"><label for="status">Status</label><select id="status" name="status"><option value="">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${#strings.replace(s,'_',' ')}" th:selected="${s == selectedStatus}"></option></select></div><button class="btn btn-secondary">Apply filters</button></form><div class="table-wrap"><table><thead><tr><th>Request</th><th>Category</th><th>Priority</th><th>Status</th><th>Updated</th></tr></thead><tbody><tr th:each="t:${tickets}"><td><a th:href="@{/tickets/{id}(id=${t.id})}" th:text="${t.title}">Ticket</a></td><td th:text="${t.category}">General</td><td th:text="${t.priority}">Normal</td><td><span class="status" th:classappend="'status-'+${t.status}" th:text="${#strings.replace(t.status,'_',' ')}"></span></td><td th:text="${#temporals.format(t.updatedAt,'dd MMM yyyy')}"></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(tickets)}">No requests match these filters.</div></div></div></main></div></body></html>
