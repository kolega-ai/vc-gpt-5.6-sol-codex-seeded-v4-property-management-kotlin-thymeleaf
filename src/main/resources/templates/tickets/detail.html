<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Maintenance request')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow"><a href="/tickets">Maintenance</a> / request</p><h1 th:text="${ticket.title}">Ticket</h1><p th:text="${ticket.category}+' · '+${ticket.priority}+' priority'"></p></div><span class="status" th:classappend="'status-'+${ticket.status}" th:text="${#strings.replace(ticket.status,'_',' ')}"></span></div><div class="detail-grid"><div class="grid"><section class="card"><h2>Request details</h2><p style="white-space:pre-wrap" th:text="${ticket.description}"></p><dl class="summary-list"><div><dt>Opened</dt><dd th:text="${#temporals.format(ticket.createdAt,'dd MMM yyyy, HH:mm')}"></dd></div><div><dt>Category</dt><dd th:text="${ticket.category}"></dd></div><div><dt>Priority</dt><dd th:text="${ticket.priority}"></dd></div><div><dt>Reference</dt><dd th:text="${#strings.substring(ticket.id.toString(),0,8)}"></dd></div></dl></section><section class="card"><h2>Conversation & notes</h2><div class="timeline"><div class="timeline-item" th:each="c:${comments}" th:classappend="${c.visibility.name() == 'INTERNAL'} ? ' internal'"><strong th:text="${c.visibility.name() == 'INTERNAL' ? 'Internal note' : 'Shared update'}"></strong><p th:text="${c.body}"></p><small class="muted" th:text="${#temporals.format(c.createdAt,'dd MMM, HH:mm')}"></small></div></div><form th:action="@{/tickets/{id}/comments(id=${ticket.id})}" th:object="${commentForm}" method="post"><div class="field"><label for="body">Add an update</label><textarea id="body" th:field="*{body}" maxlength="3000" required></textarea><span class="error-text" th:errors="*{body}"></span></div><label th:if="${actor.role.name() != 'TENANT'}"><input style="width:auto" type="checkbox" th:field="*{internal}"> Internal note — hidden from tenant</label><button class="btn btn-primary" style="margin-top:12px">Post update</button></form></section></div><aside class="grid"><section class="card" th:if="${actor.role.name() == 'PROPERTY_ADMIN' || actor.role.name() == 'PROPERTY_MANAGER'}"><h3>Assign work</h3><form th:action="@{/tickets/{id}/assign(id=${ticket.id})}" method="post"><div class="field"><label for="workerId">Maintenance specialist</label><select id="workerId" name="workerId" required><option value="">Choose a worker</option><option th:each="w:${workers}" th:value="${w.id}" th:text="${w.displayName}"></option></select></div><button class="btn btn-primary" style="margin-top:10px">Assign ticket</button></form></section><section class="card"><h3>Move work forward</h3><div th:if="${#sets.isEmpty(transitions)}" class="muted">This workflow is complete.</div><form th:each="s:${transitions}" th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post" style="margin:7px 0"><input type="hidden" name="status" th:value="${s}"><button class="btn btn-secondary" th:text="'Move to '+${#strings.toLowerCase(#strings.replace(s,'_',' '))}"></button></form></section><section class="card"><h3>Photos & evidence</h3><div class="file-row" th:each="d:${documents}"><a th:href="@{/documents/{id}/download(id=${d.id})}" th:text="${d.originalName}"></a></div><form th:action="@{/documents}" method="post" enctype="multipart/form-data"><input type="hidden" name="ticketId" th:value="${ticket.id}"><input type="hidden" name="category" value="MAINTENANCE_EVIDENCE"><div class="field"><label for="file">Upload evidence</label><input id="file" type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.txt" required></div><label><input style="width:auto" type="checkbox" name="tenantVisible" value="true"> Tenant can view</label><button class="btn btn-secondary" style="margin-top:10px">Upload file</button></form></section></aside></div></div></main></div></body></html>
