<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Request maintenance')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div class="page-head"><div><p class="eyebrow">New maintenance request</p><h1>Tell us what needs attention</h1><p>Include where the problem is and when you first noticed it.</p></div></div><form class="card" th:action="@{/tickets}" th:object="${form}" method="post"><div class="form-grid"><div class="field span-2"><label for="title">Short summary</label><input id="title" th:field="*{title}" maxlength="140" required><span class="error-text" th:errors="*{title}"></span></div><div class="field"><label for="category">Category</label><select id="category" th:field="*{category}"><option value="Plumbing">Plumbing</option><option value="Electrical">Electrical</option><option value="Heating">Heating</option><option value="Appliance">Appliance</option><option value="Safety">Safety</option><option value="General">General</option></select></div><div class="field"><label for="priority">Impact</label><select id="priority" th:field="*{priority}"><option value="LOW">Low — cosmetic or minor</option><option value="NORMAL">Normal — affects daily use</option><option value="URGENT">Urgent — safety or major loss of service</option></select></div><div class="field span-2"><label for="description">What is happening?</label><textarea id="description" th:field="*{description}" maxlength="3000" required></textarea><span class="error-text" th:errors="*{description}"></span></div></div><div class="actions" style="margin-top:20px"><button class="btn btn-primary">Submit request</button><a class="btn btn-secondary" href="/tickets">Cancel</a></div></form></div></main></div></body></html>
