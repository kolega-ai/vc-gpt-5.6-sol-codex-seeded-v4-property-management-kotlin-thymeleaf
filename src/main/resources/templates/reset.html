<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Choose password')}"></head><body><main class="login-page"><section class="login-art"><h1>Choose a strong new password.</h1></section><section class="login-panel"><div class="login-box"><h2>Set new password</h2><form th:action="@{/reset-password}" th:object="${form}" method="post"><input th:field="*{token}" type="hidden"><div class="field"><label for="password">New password</label><input id="password" th:field="*{password}" type="password" minlength="12" autocomplete="new-password" required><small>Use at least 12 characters.</small><span class="error-text" th:errors="*{password}"></span></div><div class="error-text" th:errors="*{token}"></div><button class="btn btn-primary">Update password</button></form></div></section></main></body></html>
