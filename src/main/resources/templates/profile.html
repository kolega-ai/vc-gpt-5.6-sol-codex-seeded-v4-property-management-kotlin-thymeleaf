<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Profile')}"></head><body><div class="shell"><aside th:replace="~{fragments :: sidebar}"></aside><main class="main"><header th:replace="~{fragments :: topbar}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-head"><div><p class="eyebrow">Your account</p><h1>Profile</h1><p>Keep your contact details current.</p></div></div><form class="card" style="max-width:680px" th:action="@{/profile}" th:object="${form}" method="post"><div class="form-grid"><div class="field"><label for="displayName">Display name</label><input id="displayName" th:field="*{displayName}" required><span class="error-text" th:errors="*{displayName}"></span></div><div class="field"><label for="phone">Telephone</label><input id="phone" th:field="*{phone}" autocomplete="tel"><span class="error-text" th:errors="*{phone}"></span></div></div><button class="btn btn-primary" style="margin-top:18px">Save changes</button></form><form class="card" style="max-width:680px;margin-top:18px" th:action="@{/profile/photo}" method="post" enctype="multipart/form-data"><div class="field"><label for="photo">Profile photo</label><input id="photo" name="file" type="file" required></div><button class="btn btn-secondary" style="margin-top:12px">Stage photo</button></form></div></main></div></body></html>
