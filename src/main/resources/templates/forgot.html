<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Reset password')}"></head><body><main class="login-page"><section class="login-art"><h1>Return to your workspace securely.</h1><p>Reset links expire in 30 minutes and work once.</p></section><section class="login-panel"><div class="login-box"><h2>Reset password</h2><p class="muted">We write the reset email to the local development outbox.</p><div th:replace="~{fragments :: flash}"></div><form th:action="@{/forgot-password}" th:object="${form}" method="post"><div class="field"><label for="email">Email address</label><input id="email" th:field="*{email}" type="email" required><span class="error-text" th:errors="*{email}"></span></div><button class="btn btn-primary">Create reset link</button><a href="/login">Back to sign in</a></form></div></section></main></body></html>
